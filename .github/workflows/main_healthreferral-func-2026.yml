
name: Build and deploy Healthcare Referral Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare Azure Functions package
        run: |
          mkdir -p function-package
          cp host.json package.json package-lock.json function-package/
          cp -R src function-package/src
          cd function-package
          npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_61C145438B414DBF83A5B3A4FBD32705 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B097CAE5F7104835B14852A5C2CB8F76 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B4309BFCB4CC4DAF9CCD51F27CFF680A }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: healthreferral-func-2026
          package: './function-package'
